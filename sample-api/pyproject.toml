[project]
name = "sample-api"
version = "0.1.0"
description = "평가 대상. 진짜 openapi.json 을 생성하는 더미 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# 사내 패키지 저장소 / TLS
# ---------------------------------------------------------------------------
# backend/pyproject.toml 과 동일하다. 자세한 설명은 그쪽 주석 참고.
#
# sample-api 는 사내 배포 대상이 아니다(README 참고). 그래도 사내 PC 에서
# 시연하려면 설치는 되어야 하므로 같은 설정을 둔다.

[tool.uv]
# 구 `native-tls` 는 deprecated. 사내망에서 SSL 오류 시 true 또는
# UV_SYSTEM_CERTS=true. uv 구버전 호환이 필요하면 UV_NATIVE_TLS 도 함께 설정.
#
# [tool.uv] 에서는 두 키가 다 파싱되지만 환경변수는 `UV_SYSTEM_CERTS` 만
# 유효하다 (옛 UV_NATIVE_TLS 는 조용히 무시된다).
system-certs = false

# 사내 index 는 환경변수로 전환한다. 실제 URL 을 여기 적지 않는다:
#
#     UV_DEFAULT_INDEX=https://<사내 index>/simple
#
# 파일로 고정해야 한다면 아래 형태이며, 커밋하지 않는다:
#
# [[tool.uv.index]]
# name = "internal"
# url = "https://<사내 index>/simple"
# default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
