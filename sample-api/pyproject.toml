[project]
name = "sample-api"
version = "0.1.0"
description = "평가 대상. 진짜 openapi.json 을 생성하는 더미 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# 사내 패키지 저장소
# ---------------------------------------------------------------------------
# backend/pyproject.toml 과 동일하다. 실제 URL 은 여기 적지 않고
# 환경변수로 전환한다:
#
#     UV_DEFAULT_INDEX=https://<사내 index>/simple
#     UV_SYSTEM_CERTS=true
#
# 파일로 고정해야 한다면 아래 형태이며, 커밋하지 않는다:
#
# [[tool.uv.index]]
# name = "internal"
# url = "https://<사내 index>/simple"
# default = true
#
# 참고: sample-api 는 사내 배포 대상이 아니다(README 참고). 그래도 사내 PC 에서
# 시연하려면 설치는 되어야 하므로 같은 설정을 둔다.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
