[project]
name = "backend"
version = "0.1.0"
description = "RAG 인식률 평가기 + 대시보드 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# 사내 패키지 저장소 / TLS
# ---------------------------------------------------------------------------

[tool.uv]
# 구 `native-tls` 는 deprecated. 사내망에서 SSL 오류 시 true 또는
# UV_SYSTEM_CERTS=true. uv 구버전 호환이 필요하면 UV_NATIVE_TLS 도 함께 설정.
#
# 기본값 false 로 커밋한다 — GitHub·로컬은 공인 인증서라 불필요하고,
# true 로 두면 로컬에서 OS 저장소를 뒤지느라 느려지기만 한다.
#
# 이 키를 켜야 하는 증상:
#   "self signed certificate in certificate chain"
#   "unable to get local issuer certificate"
# uv 는 기본적으로 자체 번들 인증서만 믿기 때문에, 사내 프록시가 TLS 를
# 사내 CA 로 재서명하는 환경에서는 이 설정 없이는 무조건 실패한다.
system-certs = false

# uv 0.11.7 에서 실측한 결과:
#   [tool.uv] 키 : `system-certs`(현행) 와 `native-tls`(구) 둘 다 파싱된다.
#   환경변수     : `UV_SYSTEM_CERTS` 만 유효하고,
#                  `UV_NATIVE_TLS` 는 오류 없이 조용히 무시된다.
# 그래서 파일은 현행 키로 두고, 환경변수도 현행 이름을 쓴다.
# 유효한 키 전체 목록은 [tool.uv] 에 없는 키를 넣고 `uv lock` 을 돌리면
# 에러 메시지로 다 나온다.

# 사내 index. **실제 URL 을 여기 적지 않는다** — 이 저장소는 공개돼 있다.
# 전환은 환경변수로 한다 (backend/.env.example 참고):
#
#     UV_DEFAULT_INDEX=https://<사내 index>/simple
#
# 환경변수로 두면 같은 pyproject.toml 이 사내와 GitHub 양쪽에서 그대로 쓰인다.
# 파일에 URL 을 박으면 두 저장소가 갈라지고, prompts.md §6 전파 루프가 깨진다.
#
# 사내에서 파일로 고정해야 한다면 아래 형태다. 커밋하지는 말 것:
#
# [[tool.uv.index]]
# name = "internal"
# url = "https://<사내 index>/simple"
# default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
