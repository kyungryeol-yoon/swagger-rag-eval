# scripts/ 전용 ruff 설정.
#
# backend/ 와 sample-api/ 는 각자의 pyproject.toml 에 [tool.ruff] 가 있고,
# ruff 는 파일에서 위로 올라가며 가장 가까운 설정을 쓰므로 이 파일의 영향을
# 받지 않는다. 여기 설정은 사실상 scripts/ 에만 적용된다.
#
# 프로젝트 전체가 Python 3.12 다 (로컬·사내 PC·k8s 동일).
# scripts/tasks.py 최상단의 버전 가드와 같은 기준이다.

target-version = "py312"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
